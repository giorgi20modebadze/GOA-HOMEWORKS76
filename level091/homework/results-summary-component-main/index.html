<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="stylesheet" href="style.css">


 
</head>
<body>
  <div class="parent">
    <div class="child1">
      <h3>Your Result</h3>
      <div class="point">
        <h1>76</h1>
        <p id="p1"> of 100</p>
      </div>
      <h2>Great</h2>
      <p id="p2">You scored higher than 65% of<br> the people who have taken <br> these tests.</p>

    </div>

    <div class="child2">
      <h3 id="summ">Summary</h3>
      <ul class="scores">
        <li id="list1">
          <img src="assets/images/icon-reaction.svg" alt="">
          <p> Reaction</p>
          <h3>80 / 100</h3>
        </li>

        <li id="list2">
          <img src="assets/images/icon-memory.svg" alt="">
          <p>Memory</p>
          <h3>92 / 100</h3>
        </li>

        <li id="list3">
          <img src="assets/images/icon-verbal.svg" alt="">
          <p>Verbal</p>
          <h3>61 / 100</h3>
        </li>

        <li id="list4">
          <img src="assets/images/icon-visual.svg" alt="">
          <p>Visual</p>
          <h3>72 / 100</h3>
        </li>
        
      </ul>

      <button>Continue</button>


      

    
    </div>
  </div>



</body>
</html>
